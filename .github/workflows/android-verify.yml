name: ShopEase Android build and emulator smoke test

on:
  workflow_dispatch:
  push:
    branches: [assignment-1]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout ShopEase source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Load the student's Firebase config if supplied
        env:
          FIREBASE_JSON_B64: ${{ secrets.SHOPEASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$FIREBASE_JSON_B64" ]; then
            printf '%s' "$FIREBASE_JSON_B64" | base64 --decode > app/google-services.json
            python -m json.tool app/google-services.json > /dev/null
            echo 'Firebase configuration loaded for Android build.'
          else
            echo 'No Firebase config secret: build will test UI, not live Firebase authentication.'
          fi

      - name: Verify Java and XML source
        run: python3 scripts/verify_source.py

      - name: Build Android debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopEase-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Boot emulator and smoke-test splash-to-login
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n pk.edu.nfciet.shopease/.SplashActivity
            sleep 5
            adb shell uiautomator dump /sdcard/window.xml
            adb shell cat /sdcard/window.xml | grep -q 'Welcome back'
            echo 'Emulator splash-to-login smoke test passed.'
