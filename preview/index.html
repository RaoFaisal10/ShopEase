<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopEase · Assignment 1 Visual Preview</title>
<style>
:root{--navy:#14223D;--ink:#19253C;--muted:#788193;--orange:#F4AB3E;--paper:#FAF8F4;--stroke:#e8e5df;--peach:#FFE7C4}*{box-sizing:border-box}html,body{margin:0;background:#e9edf3;color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.studio{min-height:100vh;display:flex;align-items:center;flex-direction:column;padding:30px 14px 60px}.studio-head{width:min(100%,1000px);display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.studio-brand{display:flex;gap:12px;align-items:center}.studio-mark{width:38px;height:38px;border-radius:12px;background:var(--navy);color:white;display:grid;place-items:center;font-size:20px}.studio-head h1{margin:0;font-size:18px;letter-spacing:-.04em}.studio-head p{margin:3px 0 0;font-size:12px;color:#6c788c}.tabs{display:flex;gap:5px;border:1px solid #d6dce4;border-radius:14px;padding:5px;background:white}.tab{border:none;background:transparent;border-radius:10px;padding:10px 13px;color:#59677a;font-size:12px;font-weight:700}.tab.active{color:#fff;background:var(--navy)}.phone{width:390px;height:844px;max-width:calc(100vw - 30px);position:relative;border:9px solid #242c39;border-radius:48px;background:var(--paper);box-shadow:0 34px 95px #16253d34,0 5px 20px #19253c22;overflow:hidden}.phone:after{content:"";position:absolute;bottom:9px;left:calc(50% - 53px);width:106px;height:4px;border-radius:4px;background:#aab1bb;pointer-events:none}.phone.splash-frame:after{background:#8695b0}.notch{position:absolute;z-index:9;width:112px;height:26px;background:#242c39;border-radius:0 0 19px 19px;left:calc(50% - 56px);top:0}.status{position:absolute;z-index:8;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:13px 28px 0 31px;font-size:11px;font-weight:800;letter-spacing:.035em;height:35px}.status .sys{font-size:11px;letter-spacing:2px}.screen{height:100%;width:100%;overflow:auto;scrollbar-width:none;position:absolute;inset:0;background:linear-gradient(#fffcf8,#f7f5f1);padding:57px 22px 30px}.screen::-webkit-scrollbar{display:none}.screen.splash{background:radial-gradient(circle at 75% 16%,#304b74 0%,transparent 46%),linear-gradient(165deg,#243856,#14223d 45%,#0c162b);color:white;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.splash:before{content:"";position:absolute;width:460px;height:460px;border:1px solid #ffffff12;border-radius:50%;top:-170px;left:-210px}.splash:after{content:"";position:absolute;width:410px;height:410px;border:1px solid #ffffff10;border-radius:50%;bottom:-220px;right:-220px}.splash-center{display:flex;align-items:center;flex-direction:column;transform:translateY(-7px)}.logo-tile{width:132px;height:132px;background:#2b4163;display:grid;place-items:center;border:1px solid #5a6b82;border-radius:34px;transform:rotate(-8deg);box-shadow:0 25px 60px #0003}.logo-tile svg{transform:rotate(8deg);width:108px;height:108px}.splash h1{font-size:48px;letter-spacing:-.055em;margin:26px 0 5px;font-weight:850}.splash p{color:#ccd2de;font-size:14px;letter-spacing:.055em}.splash-foot{position:absolute;bottom:53px;letter-spacing:3.2px;font-size:10px;color:#8c9ebc;font-weight:700}.top-brand{display:flex;align-items:center;justify-content:space-between}.wordmark{display:flex;align-items:center;gap:5px;font-weight:850;font-size:22px;letter-spacing:-.055em}.wordmark svg{width:40px;height:40px}.mini-pill{border:1px solid #e9e5e0;border-radius:30px;padding:10px 12px;background:white;font-size:9px;letter-spacing:1.3px;font-weight:800}.hero{margin-top:21px;border-radius:30px;height:164px;background:linear-gradient(112deg,#ffedcf,#ffdfb9);display:flex;align-items:center;padding:16px 12px 13px 22px;overflow:hidden}.hero-copy{width:53%;position:relative;z-index:1}.eyebrow{color:#9b692f;font-size:10px;letter-spacing:1.7px;font-weight:800}.hero h2{margin:10px 0 0;font-size:26px;line-height:1.06;letter-spacing:-1.5px}.hero-illus{height:168px;flex:1;width:170px;transform:translate(4px,6px)}.heading{font-size:35px;line-height:1.07;letter-spacing:-1.7px;font-weight:850;margin:26px 0 7px}.sub{font-size:13px;color:var(--muted);line-height:1.48;margin:0 0 13px}.input-wrap{margin-top:13px}.field{position:relative;display:block;border:1.4px solid #e6e5e1;border-radius:17px;background:white;height:61px;transition:border-color .15s;overflow:hidden}.field:focus-within{border-color:var(--navy);box-shadow:0 0 0 2px #14223d10}.field.error{border-color:#D64F58}.field label{position:absolute;top:10px;left:16px;font-size:11px;font-weight:600;color:#6e788b;pointer-events:none}.field input{position:absolute;bottom:6px;left:16px;right:8px;width:calc(100% - 30px);height:28px;outline:none;border:0;color:var(--navy);font-size:14px;background:transparent}.field.password input{width:calc(100% - 67px)}.eye{position:absolute;right:13px;top:22px;border:0;background:transparent;color:#596779;font-size:16px}.err{color:#ce4b50;font-size:11px;min-height:0;margin:4px 3px 0}.forgot{text-align:right;margin-top:12px}.text-btn{border:0;background:transparent;color:var(--navy);font-size:12px;font-weight:800;padding:7px 1px}.cta{margin-top:16px;width:100%;height:58px;border:0;border-radius:18px;background:var(--navy);color:#fff;font-size:15px;font-weight:800;box-shadow:0 12px 22px #14223d22;display:flex;align-items:center;justify-content:center;gap:12px}.cta span{font-size:22px;font-weight:400}.switch{display:flex;align-items:center;justify-content:center;margin-top:24px;color:var(--muted);gap:7px;font-size:13px}.switch button{background:none;border:0;color:var(--navy);font-size:13px;font-weight:800;padding:3px}.demo-note{font-size:10px;color:#a7a4a0;margin:12px 0 2px;text-align:center;line-height:1.4}.backbar{display:flex;align-items:center;justify-content:space-between}.back{height:42px;width:42px;border-radius:13px;border:1px solid #eae5dc;background:white;font-size:21px;color:var(--navy)}.signuphead{display:flex;align-items:center;justify-content:space-between;margin-top:31px;gap:7px}.signuphead .eyebrow{margin-bottom:10px}.signuphead h2{font-size:35px;letter-spacing:-1.8px;line-height:1.08;margin:0 0 8px}.signuphead p{font-size:13px;color:var(--muted);margin:0;max-width:206px;line-height:1.45}.mini-brand-art{border-radius:29px;background:#ffe6c3;display:grid;place-items:center;width:105px;height:105px;flex-shrink:0}.mini-brand-art svg{height:79px;width:79px}.details{margin:26px 0 7px;color:#263851;letter-spacing:1.7px;font-weight:800;font-size:10px}.hint{font-size:11px;color:#8a8b8c;margin:8px 3px}.prods{background:linear-gradient(#fffcf8,#f7f5f1);display:flex;flex-direction:column;padding:57px 23px 22px}.prods .heading{margin-top:12px;font-size:39px}.prods .eyebrow{margin-top:32px}.prods-top{display:flex;align-items:center;justify-content:space-between}.prods-content{flex:1;overflow:auto;scrollbar-width:none}.giftboard{position:relative;height:270px;border-radius:30px;background:linear-gradient(125deg,#fff3dc,#f9e5d1);margin-top:26px;display:grid;place-items:center;overflow:hidden}.giftboard svg{width:260px;height:220px}.smallstatus{position:absolute;top:20px;left:19px;background:white;border:1px solid #efe9df;border-radius:22px;padding:9px 13px;font-size:9px;font-weight:850;letter-spacing:1px}.prods h2{font-size:30px;line-height:1.12;letter-spacing:-1.3px;margin:20px 0 10px}.prods b.or{color:#ae712e;font-size:15px}.prods .descript{color:var(--muted);font-size:13px;line-height:1.55;margin:7px 0 20px}.logout{flex:none;background:#fff;border:1px solid #eae4df;color:#25314b;border-radius:17px;height:56px;width:100%;font-size:15px;font-weight:800}.toast{position:absolute;z-index:12;bottom:55px;left:25px;right:25px;background:#19253c;color:white;box-shadow:0 10px 30px #0004;border-radius:15px;padding:13px 15px;font-size:12px;line-height:1.45;display:none}.preview-note{font-size:12px;color:#708098;margin-top:20px;text-align:center;max-width:430px;line-height:1.45}.device-status-dark{color:#fff}.device-status-light{color:var(--ink)}.foot-dot{background:var(--orange);width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:5px}@media(max-width:680px){.studio{padding:16px 0 40px}.studio-head{flex-direction:column}.phone{width:390px;max-width:calc(100vw - 20px)}.tab{padding:9px 8px;font-size:11px}}
</style></head><body>
<main class="studio"><div class="studio-head"><div class="studio-brand"><span class="studio-mark">✦</span><div><h1>ShopEase</h1><p>Assignment 1 · Interactive UI preview</p></div></div><nav class="tabs" aria-label="Preview screens"><button class="tab" data-screen="splash">Splash</button><button class="tab" data-screen="login">Login</button><button class="tab" data-screen="signup">Sign Up</button><button class="tab" data-screen="products">Products</button></nav></div><div class="phone" id="phone"><div class="notch"></div><div class="status device-status-light" id="status"><span>9:41</span><span class="sys">● ▰ ▴</span></div><div id="screen" class="screen"></div><div id="toast" class="toast"></div></div><p class="preview-note">Interactive visual simulation. Actual Android screens use Java/XML and real Firebase; this browser preview does not create accounts or send emails.</p></main>
<script>
const LOGO=`<svg viewBox="0 0 96 96" fill="none" aria-hidden="true"><path d="M27 27c0-7 6-13 13-13h16c7 0 13 6 13 13l8 43c1 7-4 12-11 12H30c-7 0-12-5-11-12l8-43Z" fill="#F4AB3E"/><path d="M37 32v-6c0-6 5-10 11-10s11 4 11 10v6h-5v-6c0-4-2-5-6-5s-6 1-6 5v6h-5Z" fill="#14223D"/><path d="M36 51c6 9 17 10 25-1l4 4c-10 16-26 16-33 1Z" fill="#fff"/><path d="M37 44h6v5h-6zm17 0h6v5h-6z" fill="#fff"/></svg>`;
const BAGS=`<svg viewBox="0 0 300 230" xmlns="http://www.w3.org/2000/svg"><ellipse cx="158" cy="201" rx="100" ry="13" fill="#D7A779" opacity=".27"/><circle cx="230" cy="47" r="28" fill="white" opacity=".32"/><g transform="rotate(12 162 124)"><rect x="96" y="53" width="112" height="139" rx="18" fill="#FA8C61"/><rect x="99" y="55" width="107" height="40" rx="15" fill="#FFAC81"/><path d="M130 61V35m45 27-1-27" stroke="#B56446" stroke-width="7" stroke-linecap="round"/></g><g transform="rotate(-13 193 139)"><rect x="145" y="97" width="97" height="112" rx="14" fill="#1C2C4A"/><rect x="146" y="98" width="96" height="26" rx="12" fill="#263E65"/><path d="M177 103c-1-15 2-26 14-26s17 9 17 26" stroke="#FFD692" stroke-width="8" fill="none" stroke-linecap="round"/></g><circle cx="101" cy="161" r="22" fill="#FFF7DA"/><path d="M91 159h22m-11-11v22" stroke="#B8753B" stroke-width="4" stroke-linecap="round"/><path d="M253 52h10m-5-5v10" stroke="#1C2C4A" stroke-width="4" stroke-linecap="round"/></svg>`;
const GIFT=`<svg viewBox="0 0 300 230" xmlns="http://www.w3.org/2000/svg"><ellipse cx="155" cy="204" rx="112" ry="12" fill="#B88D61" opacity=".18"/><ellipse cx="149" cy="126" rx="108" ry="82" fill="#FFF3DC"/><g transform="rotate(-10 147 125)"><rect x="78" y="79" width="138" height="111" rx="15" fill="#EA9B5C"/><rect x="78" y="72" width="138" height="38" rx="12" fill="#F8BF7B"/><rect x="136" y="72" width="21" height="118" rx="2" fill="#1A2C4B"/><rect x="133" y="78" width="27" height="36" fill="#F4AB3E"/><path d="M145 73v117" stroke="#FFE7B5" stroke-width="3"/></g><circle cx="229" cy="53" r="20" fill="#1B2A46"/><path d="M219 54h18m-9-9v18" stroke="#FFDCA0" stroke-width="3" stroke-linecap="round"/><circle cx="55" cy="63" r="7" fill="#FFAC78"/><circle cx="244" cy="170" r="5" fill="#2C466D"/></svg>`;
const brand=`<div class="top-brand"><div class="wordmark">${LOGO}<span>ShopEase</span></div><span class="mini-pill">MADE FOR YOU</span></div>`;
const screens={
splash:()=>`<div class="splash-center"><div class="logo-tile">${LOGO}</div><h1>ShopEase</h1><p>Shop smart, shop easy</p></div><div class="splash-foot">GOOD THINGS START HERE</div>`,
login:()=>`${brand}<section class="hero"><div class="hero-copy"><div class="eyebrow">EVERYDAY EDIT</div><h2>Little joys.<br>Big smiles.</h2></div><div class="hero-illus">${BAGS}</div></section><h1 class="heading">Welcome back.</h1><p class="sub">Your next favorite find is just around the corner.</p>${field('email','Email address','email')}${field('password','Password','password')}<div class="forgot"><button class="text-btn" id="forgot">Forgot password?</button></div><button class="cta" id="login">Log in <span>→</span></button><div class="switch">New to ShopEase? <button id="to-signup">Sign up</button></div><p class="demo-note">Visual demo · Real authentication uses Firebase in the Android app.</p>`,
signup:()=>`<div class="backbar"><button class="back" id="back">←</button><strong style="font-size:22px;letter-spacing:-1.3px">ShopEase</strong></div><div class="signuphead"><div><div class="eyebrow">LET'S GET STARTED</div><h2>Create your<br>account.</h2><p>A few details and you're on your way.</p></div><div class="mini-brand-art">${LOGO}</div></div><div class="details">YOUR DETAILS</div>${field('name','Full name','text')}${field('email','Email address','email')}${field('password','Password','password')}${field('confirm','Confirm password','password')}<div class="hint">Use at least 6 characters</div><button class="cta" id="create">Create account <span>→</span></button><div class="switch">Already have an account? <button id="back-login">Log in</button></div><p class="demo-note">Visual simulation only · No account is created here.</p>`,
products:()=>`<div class="prods-top"><div class="wordmark">${LOGO}<span>ShopEase</span></div></div><div class="prods-content"><div class="eyebrow">WELCOME TO YOUR SPACE</div><div class="heading" id="hello">Hi, ${escapeHtml(state.name||'there')}!</div><p class="sub">We're happy you're here.</p><div class="giftboard"><span class="smallstatus">COMING SOON</span>${GIFT}</div><h2>Something good<br>is on its way.</h2><b class="or">Products coming soon</b><p class="descript">We're getting everything ready for you. The good stuff is worth the wait.</p></div><button id="logout" class="logout">Log out</button>`
};
function field(id,label,type){return `<div class="input-wrap"><div class="field ${type==='password'?'password':''}" id="wrap-${id}"><label for="f-${id}">${label}</label><input id="f-${id}" autocomplete="off" type="${type==='password'?'password':type}" ${id==='email'?'inputmode="email"':''}/>${type==='password'?`<button type="button" class="eye" data-eye="${id}" aria-label="Show password">◉</button>`:''}</div><div class="err" id="err-${id}"></div></div>`}
const state={name:'Ayesha'};let shown='';const screenEl=document.getElementById('screen');const toastEl=document.getElementById('toast');
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function toast(t){toastEl.textContent=t;toastEl.style.display='block';setTimeout(()=>toastEl.style.display='none',3000)}
function error(id,message){let e=document.getElementById('err-'+id),box=document.getElementById('wrap-'+id);if(!e)return;e.textContent=message;box.classList.toggle('error',!!message)}
function value(id){return document.getElementById('f-'+id)?.value||''}function validEmail(t){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t.trim())}
function show(which){shown=which;screenEl.className='screen '+(which==='splash'?'splash':which==='products'?'prods':'');screenEl.innerHTML=screens[which]();screenEl.scrollTop=0;document.getElementById('phone').classList.toggle('splash-frame',which==='splash');document.getElementById('status').className='status '+(which==='splash'?'device-status-dark':'device-status-light');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.screen===which));try{if(location.protocol==='file:'||location.protocol==='http:'||location.protocol==='https:')history.replaceState({},'',location.pathname+'?screen='+which);}catch(e){}bind();}
function bind(){document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const inp=document.getElementById('f-'+b.dataset.eye);inp.type=inp.type==='password'?'text':'password';b.textContent=inp.type==='text'?'⊘':'◉'});const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};on('to-signup',()=>show('signup'));on('back',()=>show('login'));on('back-login',()=>show('login'));on('logout',()=>{state.name='';show('login');toast('Signed out of the visual preview.')});on('forgot',()=>{const em=value('email');if(!validEmail(em)){error('email','Enter a valid email address');return}error('email','');toast('Preview: a password-reset link would be emailed to '+em)});on('login',()=>{const em=value('email'),pwd=value('password');error('email',validEmail(em)?'':'Enter a valid email address');if(!validEmail(em))return;error('password',pwd.length>=6?'':'Password must be at least 6 characters');if(pwd.length<6)return;state.name=state.name||'Ayesha';show('products');toast('Demo login only · Real sign-in requires Firebase.')});on('create',()=>{const nm=value('name').trim(),em=value('email'),pwd=value('password'),c=value('confirm');error('name',nm?'':'Please enter your name');if(!nm)return;error('email',validEmail(em)?'':'Enter a valid email address');if(!validEmail(em))return;error('password',pwd.length>=6?'':'Password must be at least 6 characters');if(pwd.length<6)return;error('confirm',c===pwd?'':'Passwords do not match');if(c!==pwd)return;state.name=nm;show('products');toast('Visual preview · Your account was not created.')});}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.screen));show(new URLSearchParams(location.search).get('screen') in screens?new URLSearchParams(location.search).get('screen'):'login');
</script></body></html>
